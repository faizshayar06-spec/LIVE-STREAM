name: 24/7 Persistent Stream (Auto-Reconnect)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart_stream]

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 320

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Start Loop Stream and Auto-Trigger
        env:
          S1: ${{ secrets.STREAM_1_URL }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # Install FFmpeg explicitly
          sudo apt update && sudo apt install -y ffmpeg

          echo "Starting Stream..."
          
          # FFmpeg will safely timeout at 290m, leaving ample time for curl command
          timeout -k 1m 290m ffmpeg -re -stream_loop -1 -i video.mp4 -stream_loop -1 -i audio.mp3 \
          -map 0:v:0 -map 1:a:0 -c:v libx264 -preset superfast -tune zerolatency \
          -g 60 -keyint_min 60 -sc_threshold 0 \
          -pix_fmt yuv420p -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "$S1" || echo "FFmpeg stopped or reached the time limit safely."

          echo "Stream ended. Triggering next workflow now..."
          
          # Triggering the next run successfully before job terminates
          curl -X POST -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type": "restart_stream"}'

          echo "Next workflow triggered successfully! Shutting down..."
          sleep 10s
          
