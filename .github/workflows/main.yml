name: 24/7 Persistent Stream (Auto-Reconnect)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart_stream]

concurrency:
  group: 24-7-persistent-stream-execution
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 320

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup FFmpeg & Start Stream
        env:
          S1: ${{ secrets.STREAM_1_URL }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -e
          
          # Check files
          if [ ! -f "video.mp4" ] || [ ! -f "audio.mp3" ]; then
              echo "ERROR: video.mp4 or audio.mp3 missing!"
              exit 1
          fi

          echo "Downloading static FFmpeg..."
          curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          
          # Direct exact path finding for ffmpeg binary
          FFMPEG_BIN=$(find . -type f -name "ffmpeg" -executable | head -n 1)
          if [ -z "$FFMPEG_BIN" ]; then
              echo "ERROR: FFmpeg binary not found!"
              exit 1
          fi

          echo "Starting Live Stream now..."
          
          # Stream execution with strict path
          timeout -k 1m 290m "$FFMPEG_BIN" -re -stream_loop -1 -i video.mp4 -stream_loop -1 -i audio.mp3 \
          -map 0:v:0 -map 1:a:0 -c:v libx264 -preset superfast -tune zerolatency \
          -g 60 -keyint_min 60 -sc_threshold 0 \
          -pix_fmt yuv420p -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "$S1" || echo "FFmpeg finished or timeout reached safely."

          echo "Stream ended. Triggering next workflow..."
          
          curl -X POST -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type": "restart_stream"}'

          sleep 10s
          
