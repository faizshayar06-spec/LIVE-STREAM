name: 24/7 Persistent Stream (Auto-Reconnect)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [restart_stream]

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 320

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Fast Static FFmpeg & Start Stream
        env:
          S1: ${{ secrets.STREAM_1_URL }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          echo "Downloading lightning-fast static FFmpeg..."
          # Yeh sirf 10 second mein official static build download karke set kar dega (No apt-get lag!)
          curl -sL https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          # FFmpeg binary ko path mein set karna
          SFX=$(find . -maxdepth 1 -type d -name "ffmpeg-*-static")
          export PATH="$PWD/$SFX:$PATH"

          echo "FFmpeg ready! Starting Stream instantly..."
          
          # 290 minutes par safely timeout hoga taaki curl ke liye ample time bache
          timeout -k 1m 290m ffmpeg -re -stream_loop -1 -i video.mp4 -stream_loop -1 -i audio.mp3 \
          -map 0:v:0 -map 1:a:0 -c:v libx264 -preset superfast -tune zerolatency \
          -g 60 -keyint_min 60 -sc_threshold 0 \
          -pix_fmt yuv420p -b:v 2500k -maxrate 2500k -bufsize 5000k \
          -c:a aac -b:a 128k -ar 44100 \
          -f flv "$S1" || echo "FFmpeg stopped or reached the time limit safely."

          echo "Stream ended. Triggering next workflow now..."
          
          # Triggering the next run successfully before job terminates
          curl -X POST -H "Authorization: token $GH_TOKEN" \
          -H "Accept: application/vnd.github.v3+json" \
          https://api.github.com/repos/${{ github.repository }}/dispatches \
          -d '{"event_type": "restart_stream"}'

          echo "Next workflow triggered successfully! Shutting down..."
          sleep 10s
          
